<title>Kore Prompts</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1424;--panel:#13203a;--p2:#1a2a4a;--line:#27395f;--ink:#e9eefb;--mute:#8fa3c7;--blue:#4da3ff;--glow:#ffd36b;--ok:#4cd6a0;--bad:#ff7a7a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Bricolage Grotesque',system-ui,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 96px)}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#lock{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
#lock img{width:190px;height:190px;border-radius:24px}#lock p{margin:0;color:var(--mute)}
#lock input{width:100%;max-width:280px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);text-align:center;font-size:18px}
.btn{background:var(--blue);color:#061226;font-weight:700;padding:12px 20px;border-radius:12px}.btn.ghost{background:var(--p2);color:var(--ink)}.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}
header{position:sticky;top:0;z-index:10;background:linear-gradient(var(--bg) 82%,transparent);padding:12px 16px 6px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}.top img{width:38px;height:38px;border-radius:50%}
.top h1{margin:0;font-size:22px;font-weight:800;flex:1}.sync{font-size:12px;color:var(--mute)}
.tools{display:flex;gap:8px}.tools input,.tools select{flex:1;min-width:0;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}.tools select{flex:0 0 36%}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.cp{flex:none;padding:7px 13px;border-radius:99px;background:var(--panel);color:var(--mute);font-size:14px;border:1px solid var(--line)}.cp.on{background:var(--blue);color:#061226;border-color:var(--blue);font-weight:600}
main{padding:6px 16px;display:grid;gap:12px}
h3.sh{margin:10px 0 0;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.st{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}.st b{display:block;font-size:22px;color:var(--blue)}.st span{font-size:12px;color:var(--mute)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:12px;position:relative;touch-action:pan-y}.card.pin{border-color:var(--blue)}
.th{width:64px;height:84px;border-radius:10px;background:var(--p2) center/cover;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:12px}
.cb{flex:1;min-width:0;padding-right:34px}.cid{font-weight:800;font-size:15px;color:var(--blue)}.cn{font-weight:600;margin:2px 0}
.cd{color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.chip{font-size:12px;padding:3px 8px;border-radius:99px;background:var(--p2);color:var(--mute)}
.s-w{background:#12392f;color:var(--ok)}.s-f{background:#3d1d24;color:var(--bad)}
.ic{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;align-items:center}.ib{width:34px;height:34px;border-radius:10px;font-size:18px;color:var(--mute)}.ib.on{color:var(--blue)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--glow);box-shadow:0 0 10px 3px rgba(255,211,107,.7);display:inline-block}
.empty{text-align:center;color:var(--mute);padding:40px 20px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(11,20,36,.96);border-top:1px solid var(--line);display:flex;align-items:center;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);backdrop-filter:blur(10px)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--mute);font-size:11px;padding:4px 0}nav button.on{color:var(--blue)}
nav .up{flex:none;width:54px;height:40px;border-radius:14px;background:var(--blue);color:#061226;justify-content:center;margin:0 6px}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(3,8,18,.7);display:flex;align-items:flex-end}
.sheet>div{width:100%;max-height:94%;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;border:1px solid var(--line);padding:18px 16px calc(env(safe-area-inset-bottom) + 96px)}
.sheet h2{margin:0 0 10px;font-size:20px}label{display:block;font-size:13px;color:var(--mute);margin:12px 0 4px}
.f input,.f textarea,.f select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel)}.f textarea{min-height:150px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}.hint{font-size:12px;color:var(--mute);margin-top:4px}
.blk{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin:10px 0}.blk.dn{opacity:.6}
.blk h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.blk pre{white-space:pre-wrap;word-break:break-word;margin:0;font:inherit;font-size:14px;line-height:1.5;color:#cbd7ef}
.acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}.pick button{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600}
.note{background:#fff3b8;color:#3a3000;border-radius:6px 6px 14px 6px;padding:14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.note textarea{width:100%;min-height:220px;border:0;background:transparent;color:#3a3000;resize:vertical;outline:0;line-height:1.5}.note small{color:#7a6a20}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:#061226;padding:9px 16px;border-radius:99px;font-weight:600;z-index:80}

async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function tryUnlock(){const v=$("#pin").value.toLowerCase().replace(/\s+/g,"");if(await sha(v)===PIN_HASH){try{localStorage.setItem("kp_ok",PIN_HASH)}catch(e){}$("#lock").remove()}else $("#pinerr").textContent="Wrong passcode. Try again."}
$("#unlock").onclick=tryUnlock;$("#pin").onkeydown=e=>{if(e.key==="Enter")tryUnlock()};
try{if(localStorage.getItem("kp_ok")===PIN_HASH)$("#lock").remove()}catch(e){}
function startStore(){
  if(FIREBASE_CONFIG.projectId){try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();cloud=true;
    db.collection("items").onSnapshot(s=>{items=s.docs.map(d=>({...d.data(),_id:d.id}));$("#sync").textContent="Synced";render()},e=>{$("#sync").textContent="Sync error";toast("Firebase error: "+e.code)});return}catch(e){toast("Firebase config problem")}}
  items=JSON.parse(localStorage.getItem("kp_items")||"[]");$("#sync").textContent="This phone only";render()}
async function save(it){if(!it._id)it._id="i"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const i=items.findIndex(x=>x._id===it._id);if(i<0)items.push(it);else items[i]=it;
  if(cloud){const{_id,...r}=it;await db.collection("items").doc(_id).set(r)}else localStorage.setItem("kp_items",JSON.stringify(items));render()}
async function remove(it){items=items.filter(x=>x._id!==it._id);if(cloud)await db.collection("items").doc(it._id).delete();else localStorage.setItem("kp_items",JSON.stringify(items));render()}
function splitBlocks(t){t=t.trim();if(!t)return[];let p;
  if(/^\s*(-{3,}|={3,})\s*$/m.test(t))p=t.split(/^\s*(?:-{3,}|={3,})\s*$/m);
  else{const h=/^(?=[\s#*_>\[(]*(?:block|clip|part|scene|segment)\s*\d+|[\s#*_>\[(]*\d{1,2}(?::\d{2})?\s*(?:s|sec|seconds)?\s*[-–—to]+\s*\d{1,3}(?::\d{2})?\s*(?:s|sec|seconds)\b)/im;
    if(h.test(t))p=t.split(new RegExp(h.source,"gim"));else if((t.match(/^\W*duration\s*:/gim)||[]).length>1)p=t.split(/^(?=\W*duration\s*:)/im);else p=[t]}
  return p.map(x=>x.trim()).filter(Boolean)}
function toast(m){const e=document.createElement("div");e.className="toast";e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),1500)}
async function copy(t){try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}toast("Copied")}
const allText=i=>i.section==="video"?(i.blocks||[]).map(b=>b.text).join("\n\n"):i.prompt;
const dur=i=>i.dur||((i.blocks||[]).length*10+"s");
function cardHTML(i){const v=i.section==="video",n=(i.blocks||[]).length,d=Object.keys(i.done||{}).length;
  return `<div class="card ${i.pinned?"pin":""}" data-id="${i._id}"><div class="th" style="${i.thumb?`background-image:url(${i.thumb})`:""}">${i.thumb?"":SEC[i.section].w}</div>
  <div class="cb"><div class="cid">${esc(i.code)}</div><div class="cn">${esc(i.name)}</div><div class="cd">${esc(i.desc)}</div>
  <div class="meta">${i.brand?`<span class="chip">${esc(i.brand)}</span>`:""}<span class="chip">${esc(i.type)}</span><span class="chip">${esc(i.date)}</span>${v?`<span class="chip">${esc(dur(i))}</span><span class="chip">${d}/${n} done</span>`:""}
  ${i.section!=="prompt"?`<span class="chip ${i.status==="Worked"?"s-w":i.status==="Needs fix"?"s-f":""}">${esc(i.status)}</span>`:""}${i.tool?`<span class="chip">${esc(i.tool)}</span>`:""}</div></div>
  <div class="ic"><button class="ib ${i.pinned?"on":""}" data-pin="${i._id}" aria-label="Pin">${i.pinned?"★":"☆"}</button>${i.note?'<span class="dot"></span>':""}</div></div>`}
function bindCards(root,after){root.querySelectorAll(".card").forEach(c=>{const it=items.find(x=>x._id===c.dataset.id);let x0=0,y0=0,sw=false;
  c.ontouchstart=e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY;sw=false};
  c.ontouchend=e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)>80&&Math.abs(dy)<40){sw=true;if(dx<0){it.pinned=!it.pinned;save(it);toast(it.pinned?"Pinned":"Unpinned")}else copy(allText(it))}};
  c.onclick=e=>{if(sw||e.target.closest("[data-pin]"))return;if(after)after();openItem(it)}});
  root.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>{const it=items.find(x=>x._id===b.dataset.pin);it.pinned=!it.pinned;save(it)})}
function setView(v){view=v;chip="";close();$("#q").value="";$("#bf").value="";window.scrollTo(0,0);render()}
function renderNav(){const N=[["home","Home"],["video","Reels"],["carousel","Carousels"],["add","Upload"],["poster","Posters"],["prompt","Prompts"]];
  $("#nav").innerHTML=N.map(([k,l])=>`<button data-k="${k}" class="${k==="add"?"up":k===view?"on":""}" aria-label="${l}">${svg(k)}${k==="add"?"":l}</button>`).join("");
  $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>b.dataset.k==="add"?chooser():setView(b.dataset.k))}
function brandsOf(a){return[...new Set(a.map(i=>i.brand).filter(Boolean))].sort()}
const byNew=(a,b)=>(b.date||"").localeCompare(a.date||"");
function render(){renderNav();const R=real(),q=$("#q").value.toLowerCase(),sec=view!=="home";

  const pool=sec?R.filter(i=>i.section===view):R,cur=$("#bf").value;
  $("#bf").innerHTML='<option value="">All brands</option>'+brandsOf(pool).map(b=>`<option ${b===cur?"selected":""}>${esc(b)}</option>`).join("");
  const bf=$("#bf").value;let h="";
  if(sec){const ty=[...new Set([...TYPES[view],...pool.map(i=>i.type)])];
    $("#chips").innerHTML=["All",...ty,...(view==="prompt"?[]:["Worked","Needs fix"])].map(c=>`<button class="cp ${(chip||"All")===c?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
    $("#chips").querySelectorAll("button").forEach(b=>b.onclick=()=>{chip=b.dataset.c==="All"?"":b.dataset.c;render()})}
  const match=i=>(!bf||i.brand===bf)&&(!q||[i.code,i.name,i.brand,i.desc].join(" ").toLowerCase().includes(q))&&(!chip||i.type===chip||i.status===chip);
  if(sec||q||bf){const l=pool.filter(match).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||byNew(a,b));
    h=l.length?l.map(cardHTML).join(""):`<div class="empty">Nothing here yet.<br>Tap the + button to add one.</div>`}
  else{const sh=(t,a)=>a.length?`<h3 class="sh">${t}</h3>`+a.slice(0,5).map(cardHTML).join(""):"";
    h=`<div class="stats">${Object.keys(SEC).map(k=>`<div class="st" data-go="${k}"><b>${R.filter(i=>i.section===k).length}</b><span>${SEC[k].l}</span></div>`).join("")}</div>`
     +(brandsOf(R).length?`<h3 class="sh">Brands</h3><div class="chips" style="padding-top:0">${brandsOf(R).map(b=>`<button class="cp" data-br="${esc(b)}">${esc(b)}</button>`).join("")}</div>`:"")
     +sh("Pinned",R.filter(i=>i.pinned))+sh("Worked",R.filter(i=>i.status==="Worked").sort(byNew))+sh("Recently added",[...R].sort(byNew));
    if(!R.length)h+=`<div class="empty">Your library is empty.<br>Tap the + button to save your first prompt.</div>`}
  $("#list").innerHTML=h;bindCards($("#list"));
  $("#list").querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>setView(b.dataset.go));
  $("#list").querySelectorAll("[data-br]").forEach(b=>b.onclick=()=>openBrand(b.dataset.br))}
$("#q").oninput=render;$("#bf").onchange=render;
function close(){$("#modal").innerHTML=""}
function sheet(h){$("#modal").innerHTML=`<div class="sheet"><div>${h}</div></div>`;$(".sheet").onclick=e=>{if(e.target.classList.contains("sheet"))close()}}
function chooser(){sheet(`<h2>What are you saving?</h2><div class="pick">${Object.keys(SEC).map(k=>`<button data-s="${k}">${svg(k)}${SEC[k].w}</button>`).join("")}</div>`);
  document.querySelectorAll(".pick button").forEach(b=>b.onclick=()=>openForm(null,b.dataset.s))}
function openNote(title,val,onSave){const n=document.createElement("div");n.className="sheet";n.style.zIndex=75;
  n.innerHTML=`<div style="background:none;border:0;padding:16px"><div class="note"><b>${esc(title)}</b><textarea id="nt" placeholder="Write anything…">${esc(val||"")}</textarea><small>Saves automatically when you close</small><div class="acts"><button class="btn sm" id="nc">Close</button></div></div></div>`;
  document.body.appendChild(n);const t=n.querySelector("#nt");t.focus();const done=()=>{onSave(t.value.trim());n.remove()};n.querySelector("#nc").onclick=done;n.onclick=e=>{if(e.target===n)done()}}
function openBrand(b){let bi=items.find(i=>i.section==="brand"&&i.code===b);const l=real().filter(i=>i.brand===b).sort(byNew);
  sheet(`<h2>${esc(b)}</h2><div class="hint">${l.length} saved</div><div class="acts"><button class="btn sm ghost" id="bn">Brand note ${bi&&bi.note?'<span class="dot"></span>':""}</button></div><div style="display:grid;gap:12px;margin-top:14px">${l.map(cardHTML).join("")}</div>`);
  bindCards($("#modal"),null);$("#bn").onclick=()=>openNote("Brand note · "+b,bi&&bi.note,async v=>{bi=bi||{section:"brand",code:b};bi.note=v;await save(bi);openBrand(b)})}
function openItem(it){const v=it.section==="video",bl=v?(it.blocks||[]):[{text:it.prompt}],dn=it.done||{},bn=it.bnotes||{};
  sheet(`<h2>${esc(it.code)} · ${esc(it.name)}</h2><div class="hint">${esc(it.desc)}</div>
  <div class="meta">${it.brand?`<span class="chip" id="bb" style="color:var(--blue)">${esc(it.brand)}</span>`:""}<span class="chip">${esc(it.type)}</span><span class="chip">${esc(it.date)}</span>${v?`<span class="chip">${esc(dur(it))}</span>`:""}${it.section!=="prompt"?`<span class="chip">${esc(it.status)}</span>`:""}${it.tool?`<span class="chip">${esc(it.tool)}</span>`:""}</div>
  <div class="acts"><button class="btn sm" id="ca">${v?"Copy all blocks":"Copy prompt"}</button><button class="btn sm ghost" id="nn">${it.note?"Open note ":"Add note "}${it.note?'<span class="dot"></span>':""}</button><button class="btn sm ghost" id="ed">Edit</button><button class="btn sm ghost" id="dl" style="color:var(--bad)">Delete</button></div>
  ${bl.map((b,k)=>`<div class="blk ${dn[k]?"dn":""}"><h3>${v?`Block ${k+1} (${k*10}–${k*10+10}s)`:"Prompt"}<span>${v?`<button class="btn sm ghost" data-dn="${k}">${dn[k]?"✓ Done":"To do"}</button> `:""}<button class="btn sm ghost" data-bn="${k}">Note${bn[k]?' <span class="dot"></span>':""}</button> <button class="btn sm" data-cp="${k}">Copy</button></span></h3><pre>${esc(b.text)}</pre></div>`).join("")}`);
  $("#ca").onclick=()=>copy(allText(it));if($("#bb"))$("#bb").onclick=()=>openBrand(it.brand);
  document.querySelectorAll("[data-cp]").forEach(b=>b.onclick=()=>copy(bl[+b.dataset.cp].text));
  document.querySelectorAll("[data-dn]").forEach(b=>b.onclick=async()=>{const k=b.dataset.dn;it.done=it.done||{};if(it.done[k])delete it.done[k];else it.done[k]=true;await save(it);openItem(it)});
  $("#nn").onclick=()=>openNote("Note · "+it.code,it.note,async x=>{it.note=x;await save(it);openItem(it)});
  document.querySelectorAll("[data-bn]").forEach(b=>b.onclick=()=>{const k=+b.dataset.bn;openNote(`Note · ${it.code} · Block ${k+1}`,bn[k],async x=>{it.bnotes=it.bnotes||{};if(x)it.bnotes[k]=x;else delete it.bnotes[k];await save(it);openItem(it)})});
  $("#ed").onclick=()=>openForm(it,it.section);$("#dl").onclick=async()=>{if(confirm("Delete "+it.code+"?")){await remove(it);close()}}}
function nextCode(b,s){const p=(b||SEC[s].w).toUpperCase().replace(/[^A-Z0-9]+/g,"").slice(0,8)||"ITEM";return p+"-"+String(real().filter(i=>i.code&&i.code.startsWith(p+"-")).length+1).padStart(3,"0")}
function shrink(f,cb){const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{const s=Math.min(1,240/Math.max(m.width,m.height)),c=document.createElement("canvas");c.width=m.width*s;c.height=m.height*s;c.getContext("2d").drawImage(m,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.6))};m.src=r.result};r.readAsDataURL(f)}
const opts=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
function openForm(it,s){const ed=!!it,d=it||{section:s,status:"Draft",type:TYPES[s][0],date:new Date().toISOString().slice(0,10),prompt:""},v=s==="video",pr=s==="prompt";
  const ty=[...new Set([...TYPES[s],...real().filter(i=>i.section===s).map(i=>i.type),d.type])];
  sheet(`<h2>${ed?"Edit":"New"} ${SEC[s].w.toLowerCase()}</h2><div class="f">
  <div class="row"><div><label>ID</label><input id="fc" value="${esc(d.code||"")}" placeholder="Auto if empty"></div><div><label>Brand</label><input id="fb" value="${esc(d.brand||"")}" placeholder="YIRA"></div></div>
  <label>Name</label><input id="fn" value="${esc(d.name||"")}"><label>Short description</label><input id="fd" value="${esc(d.desc||"")}">
  <div class="row"><div><label>Type</label><select id="ft">${opts(ty,d.type)}<option value="__n">+ Add new type</option></select></div><div><label>Date</label><input id="fdt" type="date" value="${d.date}"></div></div>
  ${pr?"":`<div class="row"><div><label>Status</label><select id="fs">${opts(STATUS,d.status)}</select></div><div><label>Tool</label><select id="ftl"><option value="">None</option>${opts(TOOLS,d.tool)}</select></div></div>`}
  ${v?`<label>Duration (optional)</label><input id="fdu" value="${esc(d.dur||"")}" placeholder="Auto from blocks, e.g. 30s">`:""}
  <label>Cover image (optional)</label><input id="fi" type="file" accept="image/*"><label>${v?"Full prompt":"Prompt"}</label>
  <textarea id="fp" placeholder="Paste the whole prompt here">${esc(v?(d.blocks||[]).map(b=>b.text).join("\n---\n"):d.prompt)}</textarea>
  ${v?`<div class="hint" id="bc"></div><div class="hint">Blocks split by "Block 1", "0–10s", or a line with ---.</div>`:""}
  <div class="acts"><button class="btn" id="sv">Save</button><button class="btn ghost" id="cn2">Cancel</button></div></div>`);
  let th=d.thumb||"";$("#fi").onchange=e=>{if(e.target.files[0])shrink(e.target.files[0],u=>th=u)};
  $("#ft").onchange=e=>{if(e.target.value==="__n"){const n=(prompt("New type name")||"").trim();if(n){const o=new Option(n,n,true,true);e.target.add(o,e.target.options[e.target.options.length-1])}else e.target.selectedIndex=0}};
  const up=()=>{if(v)$("#bc").textContent=splitBlocks($("#fp").value).length+" block(s) detected"};$("#fp").oninput=up;up();
  $("#cn2").onclick=()=>ed?openItem(it):close();
  $("#sv").onclick=async()=>{const p=$("#fp").value.trim();if(!$("#fn").value.trim()||!p){toast("Add a name and a prompt");return}
    const o={...d,section:s,brand:$("#fb").value.trim(),name:$("#fn").value.trim(),desc:$("#fd").value.trim(),type:$("#ft").value,date:$("#fdt").value,thumb:th};
    if(!pr){o.status=$("#fs").value;o.tool=$("#ftl").value}if(v)o.dur=$("#fdu").value.trim();
    o.code=$("#fc").value.trim()||d.code||nextCode(o.brand,s);
    if(v){o.blocks=splitBlocks(p).map(text=>({text}));delete o.prompt}else o.prompt=p;
    await save(o);if(!ed&&view!==s&&view!=="home")view=s;ed?openItem(o):close()}}
startStore();
</script></body></html>
